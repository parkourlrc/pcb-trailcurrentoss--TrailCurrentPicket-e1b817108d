<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-down" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0 Z" fill="#52a441"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="#ffffff"/>

  <!-- Title bar -->
  <rect width="1100" height="54" fill="#f8f9fa"/>
  <rect y="54" width="1100" height="3" fill="#52a441"/>
  <text x="24" y="35" font-size="16" font-weight="700" fill="#52a441">TrailCurrent Picket</text>
  <text x="260" y="35" font-size="13" fill="#495057">20-Pin Ribbon Cable — Reed Switch Wiring Reference</text>
  <text x="1076" y="35" text-anchor="end" font-size="10" fill="#6c757d">IDC 2x10 connector</text>

  <!-- Subtitle -->
  <text x="550" y="82" text-anchor="middle" font-size="12" fill="#495057">Flat ribbon cable layout — red stripe marks Pin 1 (3.3V / 5V end)</text>

  <!-- =============== RIBBON CABLE VISUALIZATION =============== -->
  <!-- Cable body background -->
  <rect x="40" y="100" width="1020" height="210" fill="#f1f3f5" stroke="#ced4da" stroke-width="1" rx="6"/>

  <!-- 20 individual wires, left to right -->
  <!-- Each wire is a vertical strip: 46px wide, 4px gap -->
  <!-- x starts at 52, each wire = 50px pitch -->

  <!-- Pin 1: 3.3V — RED STRIPE -->
  <rect x="52" y="108" width="46" height="194" fill="#c0392b" stroke="#922b21" stroke-width="1" rx="2"/>
  <text x="75" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
  <text x="75" y="148" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">3.3V</text>
  <text x="75" y="165" text-anchor="middle" font-size="9" fill="#ffd5d5">Power</text>
  <text x="75" y="290" text-anchor="middle" font-size="8" fill="#ffd5d5">RED STRIPE</text>

  <!-- Pin 2: 5V -->
  <rect x="102" y="108" width="46" height="194" fill="#52a441" stroke="#3d7d31" stroke-width="1" rx="2"/>
  <text x="125" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
  <text x="125" y="148" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">5V</text>
  <text x="125" y="165" text-anchor="middle" font-size="9" fill="#e6f1e0">Power</text>

  <!-- Pin 3: GND -->
  <rect x="152" y="108" width="46" height="194" fill="#6c757d" stroke="#495057" stroke-width="1" rx="2"/>
  <text x="175" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">3</text>
  <text x="175" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">GND</text>
  <text x="175" y="165" text-anchor="middle" font-size="9" fill="#dee2e6">Ground</text>

  <!-- Pin 4: GND -->
  <rect x="202" y="108" width="46" height="194" fill="#6c757d" stroke="#495057" stroke-width="1" rx="2"/>
  <text x="225" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">4</text>
  <text x="225" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">GND</text>
  <text x="225" y="165" text-anchor="middle" font-size="9" fill="#dee2e6">Ground</text>

  <!-- Pin 5: IO43 — RSW12 (Byte 1) -->
  <rect x="252" y="108" width="46" height="194" fill="#1f4e79" stroke="#133855" stroke-width="1" rx="2"/>
  <text x="275" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">5</text>
  <text x="275" y="148" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">IO43</text>
  <text x="275" y="165" text-anchor="middle" font-size="9" fill="#cfe0f5">RSW12</text>

  <!-- Pin 6: IO20 — USB D+ (reserved) -->
  <rect x="302" y="108" width="46" height="194" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="2"/>
  <text x="325" y="130" text-anchor="middle" font-size="12" fill="#6c757d" font-weight="700">6</text>
  <text x="325" y="148" text-anchor="middle" font-size="10" fill="#6c757d" font-weight="600">IO20</text>
  <text x="325" y="165" text-anchor="middle" font-size="9" fill="#adb5bd">USB D+</text>
  <text x="325" y="178" text-anchor="middle" font-size="8" fill="#adb5bd">reserved</text>

  <!-- Pin 7: IO44 — unused -->
  <rect x="352" y="108" width="46" height="194" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="2"/>
  <text x="375" y="130" text-anchor="middle" font-size="12" fill="#6c757d" font-weight="700">7</text>
  <text x="375" y="148" text-anchor="middle" font-size="10" fill="#6c757d" font-weight="600">IO44</text>
  <text x="375" y="165" text-anchor="middle" font-size="9" fill="#adb5bd">unused</text>

  <!-- Pin 8: IO19 — USB D- (reserved) -->
  <rect x="402" y="108" width="46" height="194" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="2"/>
  <text x="425" y="130" text-anchor="middle" font-size="12" fill="#6c757d" font-weight="700">8</text>
  <text x="425" y="148" text-anchor="middle" font-size="10" fill="#6c757d" font-weight="600">IO19</text>
  <text x="425" y="165" text-anchor="middle" font-size="9" fill="#adb5bd">USB D-</text>
  <text x="425" y="178" text-anchor="middle" font-size="8" fill="#adb5bd">reserved</text>

  <!-- Pin 9: IO3 — unused -->
  <rect x="452" y="108" width="46" height="194" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="2"/>
  <text x="475" y="130" text-anchor="middle" font-size="12" fill="#6c757d" font-weight="700">9</text>
  <text x="475" y="148" text-anchor="middle" font-size="10" fill="#6c757d" font-weight="600">IO3</text>
  <text x="475" y="165" text-anchor="middle" font-size="9" fill="#adb5bd">--</text>

  <!-- Pin 10: IO14 — RSW11 (Byte 1) -->
  <rect x="502" y="108" width="46" height="194" fill="#1f4e79" stroke="#133855" stroke-width="1" rx="2"/>
  <text x="525" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">10</text>
  <text x="525" y="148" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">IO14</text>
  <text x="525" y="165" text-anchor="middle" font-size="9" fill="#cfe0f5">RSW11</text>

  <!-- Pin 11: IO4 — RSW01 (Byte 0) -->
  <rect x="552" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="575" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">11</text>
  <text x="575" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO4</text>
  <text x="575" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW01</text>

  <!-- Pin 12: IO13 — RSW10 (Byte 1) -->
  <rect x="602" y="108" width="46" height="194" fill="#1f4e79" stroke="#133855" stroke-width="1" rx="2"/>
  <text x="625" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">12</text>
  <text x="625" y="148" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">IO13</text>
  <text x="625" y="165" text-anchor="middle" font-size="9" fill="#cfe0f5">RSW10</text>

  <!-- Pin 13: IO5 — RSW02 (Byte 0) -->
  <rect x="652" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="675" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">13</text>
  <text x="675" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO5</text>
  <text x="675" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW02</text>

  <!-- Pin 14: IO12 — RSW09 (Byte 1) -->
  <rect x="702" y="108" width="46" height="194" fill="#1f4e79" stroke="#133855" stroke-width="1" rx="2"/>
  <text x="725" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">14</text>
  <text x="725" y="148" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">IO12</text>
  <text x="725" y="165" text-anchor="middle" font-size="9" fill="#cfe0f5">RSW09</text>

  <!-- Pin 15: IO6 — RSW03 (Byte 0) -->
  <rect x="752" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="775" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">15</text>
  <text x="775" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO6</text>
  <text x="775" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW03</text>

  <!-- Pin 16: IO11 — RSW08 (Byte 0) -->
  <rect x="802" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="825" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">16</text>
  <text x="825" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO11</text>
  <text x="825" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW08</text>

  <!-- Pin 17: IO7 — RSW04 (Byte 0) -->
  <rect x="852" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="875" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">17</text>
  <text x="875" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO7</text>
  <text x="875" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW04</text>

  <!-- Pin 18: IO10 — RSW07 (Byte 0) -->
  <rect x="902" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="925" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">18</text>
  <text x="925" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO10</text>
  <text x="925" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW07</text>

  <!-- Pin 19: IO8 — RSW05 (Byte 0) -->
  <rect x="952" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="975" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">19</text>
  <text x="975" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO8</text>
  <text x="975" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW05</text>

  <!-- Pin 20: IO9 — RSW06 (Byte 0) -->
  <rect x="1002" y="108" width="46" height="194" fill="#2980b9" stroke="#1f6090" stroke-width="1" rx="2"/>
  <text x="1025" y="130" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">20</text>
  <text x="1025" y="148" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">IO9</text>
  <text x="1025" y="165" text-anchor="middle" font-size="9" fill="#d6e7f3">RSW06</text>

  <!-- Row origin labels below ribbon -->
  <text x="75" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="125" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="175" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="225" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="275" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="325" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="375" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="425" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="475" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="525" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="575" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="625" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="675" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="725" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="775" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="825" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="875" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="925" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>
  <text x="975" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Outer</text>
  <text x="1025" y="324" text-anchor="middle" font-size="8" fill="#6c757d">Inner</text>

  <!-- =============== GROUPED BY CAN BYTE =============== -->
  <rect y="348" width="1100" height="3" fill="#3d7d31"/>
  <text x="550" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#212529">Wires Grouped by CAN Byte</text>
  <text x="550" y="390" text-anchor="middle" font-size="10" fill="#6c757d">Which ribbon cable wires correspond to each reed switch (wire number = pin number)</text>

  <!-- DoorStatus1to8 (Byte 0) — RSW01-RSW08 -->
  <rect x="40" y="408" width="500" height="170" fill="#f8f9fa" stroke="#2980b9" stroke-width="2" rx="6"/>
  <text x="290" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6090">DoorStatus1to8 (Byte 0) — RSW01-RSW08</text>

  <text x="60"  y="458" font-size="11" fill="#495057">Wire 11</text>
  <text x="140" y="458" font-size="11" fill="#1f6090" font-weight="600">IO4</text>
  <text x="220" y="458" font-size="11" fill="#212529">RSW01</text>
  <text x="320" y="458" font-size="11" fill="#495057">Wire 13</text>
  <text x="400" y="458" font-size="11" fill="#1f6090" font-weight="600">IO5</text>
  <text x="480" y="458" font-size="11" fill="#212529">RSW02</text>

  <text x="60"  y="480" font-size="11" fill="#495057">Wire 15</text>
  <text x="140" y="480" font-size="11" fill="#1f6090" font-weight="600">IO6</text>
  <text x="220" y="480" font-size="11" fill="#212529">RSW03</text>
  <text x="320" y="480" font-size="11" fill="#495057">Wire 17</text>
  <text x="400" y="480" font-size="11" fill="#1f6090" font-weight="600">IO7</text>
  <text x="480" y="480" font-size="11" fill="#212529">RSW04</text>

  <text x="60"  y="502" font-size="11" fill="#495057">Wire 19</text>
  <text x="140" y="502" font-size="11" fill="#1f6090" font-weight="600">IO8</text>
  <text x="220" y="502" font-size="11" fill="#212529">RSW05</text>
  <text x="320" y="502" font-size="11" fill="#495057">Wire 20</text>
  <text x="400" y="502" font-size="11" fill="#1f6090" font-weight="600">IO9</text>
  <text x="480" y="502" font-size="11" fill="#212529">RSW06</text>

  <text x="60"  y="524" font-size="11" fill="#495057">Wire 18</text>
  <text x="140" y="524" font-size="11" fill="#1f6090" font-weight="600">IO10</text>
  <text x="220" y="524" font-size="11" fill="#212529">RSW07</text>
  <text x="320" y="524" font-size="11" fill="#495057">Wire 16</text>
  <text x="400" y="524" font-size="11" fill="#1f6090" font-weight="600">IO11</text>
  <text x="480" y="524" font-size="11" fill="#212529">RSW08</text>

  <text x="60" y="558" font-size="10" fill="#6c757d">Each reed switch: one terminal to its IO wire, other to GND (Wire 3 or 4)</text>

  <!-- DoorStatus9to12 (Byte 1) — RSW09-RSW12 -->
  <rect x="570" y="408" width="490" height="170" fill="#f8f9fa" stroke="#1f4e79" stroke-width="2" rx="6"/>
  <text x="815" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#133855">DoorStatus9to12 (Byte 1) — RSW09-RSW12</text>

  <text x="590" y="458" font-size="11" fill="#495057">Wire 14</text>
  <text x="670" y="458" font-size="11" fill="#133855" font-weight="600">IO12</text>
  <text x="750" y="458" font-size="11" fill="#212529">RSW09</text>

  <text x="590" y="480" font-size="11" fill="#495057">Wire 12</text>
  <text x="670" y="480" font-size="11" fill="#133855" font-weight="600">IO13</text>
  <text x="750" y="480" font-size="11" fill="#212529">RSW10</text>

  <text x="590" y="502" font-size="11" fill="#495057">Wire 10</text>
  <text x="670" y="502" font-size="11" fill="#133855" font-weight="600">IO14</text>
  <text x="750" y="502" font-size="11" fill="#212529">RSW11</text>

  <text x="590" y="524" font-size="11" fill="#495057">Wire 5</text>
  <text x="670" y="524" font-size="11" fill="#133855" font-weight="600">IO43</text>
  <text x="750" y="524" font-size="11" fill="#212529">RSW12</text>

  <text x="590" y="558" font-size="10" fill="#6c757d">RSW12 is on Wire 5 (the byte 1 group is interleaved across the cable)</text>

  <!-- =============== LEGEND =============== -->
  <rect x="40" y="598" width="1020" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="70" y="620" font-size="11" font-weight="700" fill="#212529">Legend:</text>
  <rect x="130" y="608" width="14" height="14" fill="#2980b9" rx="2"/>
  <text x="150" y="620" font-size="10" fill="#495057">DoorStatus1to8 (RSW01-08)</text>
  <rect x="310" y="608" width="14" height="14" fill="#1f4e79" rx="2"/>
  <text x="330" y="620" font-size="10" fill="#495057">DoorStatus9to12 (RSW09-12)</text>
  <rect x="490" y="608" width="14" height="14" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="2"/>
  <text x="510" y="620" font-size="10" fill="#495057">Unused / Reserved</text>
  <rect x="630" y="608" width="14" height="14" fill="#52a441" rx="2"/>
  <text x="650" y="620" font-size="10" fill="#495057">Power</text>
  <rect x="710" y="608" width="14" height="14" fill="#6c757d" rx="2"/>
  <text x="730" y="620" font-size="10" fill="#495057">Ground</text>
  <rect x="790" y="608" width="14" height="14" fill="#c0392b" rx="2"/>
  <text x="810" y="620" font-size="10" fill="#495057">Red Stripe (Pin 1)</text>

  <text x="70" y="646" font-size="10" fill="#1f6090" font-weight="600">Note:</text>
  <text x="110" y="646" font-size="10" fill="#495057">Wires 6, 7, 8, 9 (IO20, IO44, IO19, IO3) are unused — do not connect reed switches to these.</text>
  <text x="750" y="646" font-size="10" fill="#495057">All reed switches share GND (Wire 3 or 4).</text>

  <!-- Footer -->
  <rect y="670" width="1100" height="30" fill="#f8f9fa"/>
  <text x="24" y="689" font-size="9" fill="#52a441" font-weight="600">TrailCurrent</text>
  <text x="110" y="689" font-size="9" fill="#6c757d">Picket — IDC 2x10 ribbon cable pinout (standard odd/even row interleave)</text>
</svg>
